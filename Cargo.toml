[workspace]
resolver = "3"
members = ["crates/*", "dev/build-libopenmpt"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pak = { path = "crates/pak" }
sexy = { path = "crates/sexy" }
openmpt = { path = "crates/openmpt" }
bevy = { version = "0.20", features = ["jpeg", "wav", "wayland"] }
rfd = "0.17"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
roxmltree = "0.21"
# Same version Bevy uses; only the decoders PvZ assets need.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tga"] }

# Bevy is unbearably slow at opt-level 0; optimise deps, keep our code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
